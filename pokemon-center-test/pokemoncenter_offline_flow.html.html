<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Center Warteschlange</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f0f8ff;
        }
        #queue-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        #position { font-size: 2em; font-weight: bold; color: #e60012; }
        #status { font-size: 1.2em; margin: 20px 0; }
        #timer { font-size: 1.5em; font-weight: bold; }
    </style>
</head>
<body>
    <div id="queue-container">
        <h1>Pokémon Center</h1>
        <div id="queue-position">
            <p>Ihre Position in der Warteschlange:</p>
            <div id="position">12</div>
        </div>
        <div id="status">Warteschlange - bitte warten...</div>
        <div id="timer">Verbleibende Zeit: <span id="time">5:00</span></div>
    </div>

    <script>
        let pos = 12;
        let seconds = 300; // 5 Minuten
        
        function updateTimer() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('time').textContent = 
                `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        function updateQueue() {
            if (pos > 0) {
                pos--;
                seconds -= 2;
                document.getElementById('position').textContent = pos;
                document.getElementById('status').textContent = 
                    pos > 0 ? `Warteschlange - Position: ${pos}` : 'Freigegeben!';
                
                updateTimer();
                
                if (pos === 0) {
                    setTimeout(() => {
                        window.location.href = 'products.html';
                    }, 2000);
                }
            }
        }
        
        setInterval(updateQueue, 2000);
        updateTimer();
    </script>
</body>
</html>
