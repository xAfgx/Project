<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reCAPTCHA Grid Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f0f8ff;
        }
        .captcha-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .challenge-instruction {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #333;
        }
        .captcha-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 300px;
            margin: 20px auto;
        }
        .captcha-tile {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid transparent;
            cursor: pointer;
            transition: border 0.2s;
        }
        .captcha-tile.selected {
            border: 2px solid #4CAF50;
        }
        .captcha-submit {
            margin-top: 20px;
            padding: 12px 25px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
        }
        .captcha-submit:hover {
            background: #45a049;
        }
        .captcha-submit:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="captcha-container">
        <h2>reCAPTCHA Grid Challenge</h2>
        <div class="challenge-instruction">
            Wähle alle Bilder mit <strong>Pikachu</strong> aus
        </div>
        
        <div class="captcha-grid">
            <img src="tile1.jpg" class="captcha-tile" data-tile="1">
            <img src="tile2.jpg" class="captcha-tile" data-tile="2">
            <img src="tile3.jpg" class="captcha-tile" data-tile="3">
            <img src="tile4.jpg" class="captcha-tile" data-tile="4">
            <img src="tile5.jpg" class="captcha-tile" data-tile="5">
            <img src="tile6.jpg" class="captcha-tile" data-tile="6">
            <img src="tile7.jpg" class="captcha-tile" data-tile="7">
            <img src="tile8.jpg" class="captcha-tile" data-tile="8">
            <img src="tile9.jpg" class="captcha-tile" data-tile="9">
        </div>
        
        <button id="captcha-submit" class="captcha-submit" disabled>
            Bestätigen
        </button>
    </div>

    <script>
        let selectedTiles = new Set();
        
        // Tile-Selektion
        document.querySelectorAll('.captcha-tile').forEach(tile => {
            tile.addEventListener('click', function() {
                const tileNum = this.dataset.tile;
                
                if (selectedTiles.has(tileNum)) {
                    selectedTiles.delete(tileNum);
                    this.classList.remove('selected');
                } else {
                    selectedTiles.add(tileNum);
                    this.classList.add('selected');
                }
                
                // Aktiviere Submit-Button wenn mindestens ein Tile ausgewählt
                document.getElementById('captcha-submit').disabled = selectedTiles.size === 0;
            });
        });
        
        // Submit-Handler
        document.getElementById('captcha-submit').addEventListener('click', function() {
            const selected = Array.from(selectedTiles).map(num => parseInt(num));
            console.log('Ausgewählte Tiles:', selected);
            
            // Simuliere erfolgreiche Verifizierung
            alert(`Ausgewählt: ${selected.join(', ')}`);
            alert('Captcha erfolgreich bestätigt!');
            
            // Weiterleitung zum Checkout
            setTimeout(() => {
                window.location.href = 'checkout.html';
            }, 1500);
        });
    </script>
</body>
</html>
