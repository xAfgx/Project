name: Windows OOPIF parent-crash smoke

on:
  push:
    branches:
      - smoke/windows-node-hardcrash
  workflow_dispatch:

jobs:
  oopif-hardcrash:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SeleniumBase runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Run five production-entry OOPIF hard-crash sessions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sessionCount = 5
          $root = Join-Path $env:RUNNER_TEMP 'ares-oopif-hardcrash'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          @'
          const { spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const slot = String(process.argv[2]);
          const profileDir = String(process.argv[3]);
          const pythonExe = process.env.pythonLocation
            ? path.join(process.env.pythonLocation, 'python.exe')
            : 'python';
          const prefix = `session-${slot}`;

          const child = spawn(
            pythonExe,
            ['-u', 'python/seleniumbase_cdp/task_browser_worker_oopif.py'],
            {
              stdio: ['pipe', 'pipe', 'pipe'],
              windowsHide: true,
              env: { ...process.env, PYTHONUNBUFFERED: '1' }
            }
          );

          fs.writeFileSync(`${prefix}.python.pid`, String(child.pid));
          child.stdout.pipe(fs.createWriteStream(`${prefix}.python.stdout.log`, { flags: 'a' }));
          child.stderr.pipe(fs.createWriteStream(`${prefix}.python.stderr.log`, { flags: 'a' }));

          child.stdin.write(JSON.stringify({
            type: 'start',
            requestId: `oopif-hardcrash-start-${slot}`,
            taskId: `oopif-hardcrash-task-${slot}`,
            profileDir,
            headless: true,
            browserArgs: []
          }) + '\n');

          setInterval(() => {}, 1000);
          '@ | Set-Content -Path crash-parent.js -Encoding UTF8

          $sessions = @()
          for ($i = 1; $i -le $sessionCount; $i++) {
            $profile = Join-Path $root "profile-$i"
            New-Item -ItemType Directory -Force -Path $profile | Out-Null
            $parent = Start-Process node -ArgumentList @('crash-parent.js', "$i", $profile) -PassThru -RedirectStandardOutput "session-$i.node.stdout.log" -RedirectStandardError "session-$i.node.stderr.log"
            $sessions += [pscustomobject]@{
              Slot = $i
              Profile = $profile
              Parent = $parent
              PythonPid = $null
              PythonProc = $null
              ChromePid = $null
            }
            Write-Host "SESSION $i Node=$($parent.Id) profile=$profile"
          }

          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $readyCount = 0
            foreach ($session in $sessions) {
              if ($session.PythonPid -and $session.ChromePid) {
                $readyCount++
                continue
              }
              $pidFile = "session-$($session.Slot).python.pid"
              $stdoutFile = "session-$($session.Slot).python.stdout.log"
              if ((Test-Path $pidFile) -and (Test-Path $stdoutFile)) {
                $readyLine = Get-Content $stdoutFile -ErrorAction SilentlyContinue |
                  Where-Object { $_ -match '"type"\s*:\s*"ready"' } |
                  Select-Object -Last 1
                if ($readyLine) {
                  $session.PythonPid = [int](Get-Content $pidFile)
                  $session.PythonProc = Get-Process -Id $session.PythonPid -ErrorAction Stop
                  $jsonText = $readyLine -replace '^ARES_SB_TASK\s*', ''
                  $ready = $jsonText | ConvertFrom-Json
                  $session.ChromePid = [int]$ready.pid
                  Write-Host "SESSION $($session.Slot) READY node=$($session.Parent.Id) python=$($session.PythonPid) chrome=$($session.ChromePid)"
                  $readyCount++
                }
              }
              if ($session.Parent.HasExited -and -not $session.ChromePid) {
                Write-Host "--- SESSION $($session.Slot) stdout ---"
                if (Test-Path $stdoutFile) { Get-Content $stdoutFile }
                $stderrFile = "session-$($session.Slot).python.stderr.log"
                Write-Host "--- SESSION $($session.Slot) stderr ---"
                if (Test-Path $stderrFile) { Get-Content $stderrFile }
                throw "SESSION $($session.Slot) Node parent exited before OOPIF worker became ready."
              }
            }
            if ($readyCount -eq $sessionCount) { break }
            Start-Sleep -Milliseconds 500
          }

          $notReady = @($sessions | Where-Object { -not $_.PythonPid -or -not $_.ChromePid })
          if ($notReady.Count -gt 0) {
            foreach ($session in $notReady) {
              Write-Host "--- SESSION $($session.Slot) stdout ---"
              if (Test-Path "session-$($session.Slot).python.stdout.log") { Get-Content "session-$($session.Slot).python.stdout.log" }
              Write-Host "--- SESSION $($session.Slot) stderr ---"
              if (Test-Path "session-$($session.Slot).python.stderr.log") { Get-Content "session-$($session.Slot).python.stderr.log" }
            }
            throw "$($notReady.Count) of $sessionCount OOPIF workers did not become ready."
          }

          Write-Host 'Hard-killing Node parents only...'
          foreach ($session in $sessions) {
            Stop-Process -Id $session.Parent.Id -Force -ErrorAction Stop
          }

          function Get-SessionState($session, $label) {
            $session.PythonProc.Refresh()
            $pythonExited = $session.PythonProc.HasExited
            $pythonExit = 'still-running'
            if ($pythonExited) {
              try {
                $code = [int]$session.PythonProc.ExitCode
                $unsigned = [BitConverter]::ToUInt32([BitConverter]::GetBytes($code), 0)
                $pythonExit = "$code/$(('0x{0:X8}' -f $unsigned))"
              } catch {
                $pythonExit = "unavailable:$($_.Exception.Message)"
              }
            }
            $reportedChromeAlive = $null -ne (Get-Process -Id $session.ChromePid -ErrorAction SilentlyContinue)
            $profileChromes = @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match '^(chrome|chromium).*\.exe$' -and
                  $_.CommandLine -and
                  $_.CommandLine.Contains($session.Profile)
                }
            )
            Write-Host "RESULT $label session=$($session.Slot) pythonExited=$pythonExited pythonExit=$pythonExit reportedChromeAlive=$reportedChromeAlive profileChromeCount=$($profileChromes.Count)"
            return [pscustomobject]@{
              Slot = $session.Slot
              PythonExited = $pythonExited
              PythonExit = $pythonExit
              ReportedChromeAlive = $reportedChromeAlive
              ProfileChromes = $profileChromes
            }
          }

          Start-Sleep -Seconds 5
          $states5 = @()
          foreach ($session in $sessions) {
            $states5 += Get-SessionState $session 'after5s'
          }

          Start-Sleep -Seconds 15
          $states20 = @()
          foreach ($session in $sessions) {
            $states20 += Get-SessionState $session 'after20s'
          }

          $zombies = @($states20 | Where-Object {
            $_.ReportedChromeAlive -or $_.ProfileChromes.Count -gt 0
          })
          Write-Host "SUMMARY sessions=$sessionCount zombieChromeSessionsAfter20s=$($zombies.Count)"
          foreach ($state in $states20) {
            Write-Host "SUMMARY session=$($state.Slot) pythonExited=$($state.PythonExited) pythonExit=$($state.PythonExit) chrome=$($state.ReportedChromeAlive) chromeCount=$($state.ProfileChromes.Count)"
          }

          # Clean only the isolated test processes after all evidence is collected.
          foreach ($session in $sessions) {
            Stop-Process -Id $session.PythonPid -Force -ErrorAction SilentlyContinue
          }
          foreach ($state in $states20) {
            foreach ($proc in $state.ProfileChromes) {
              Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          if ($zombies.Count -gt 0) {
            Write-Error "OOPIF_ZOMBIE_REPRODUCED: $($zombies.Count) of $sessionCount production-entry sessions retained Chrome after 20 seconds."
            exit 42
          }

          Write-Host "OOPIF_CLEAN_EXIT: all $sessionCount production-entry sessions cleaned up after Node parent death."

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-oopif-parent-crash-logs
          path: |
            session-*.python.stdout.log
            session-*.python.stderr.log
            session-*.node.stdout.log
            session-*.node.stderr.log
          if-no-files-found: ignore
