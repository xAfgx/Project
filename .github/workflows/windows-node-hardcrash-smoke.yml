name: Windows OOPIF cleanup ownership isolation

on:
  push:
    branches:
      - smoke/windows-node-hardcrash
  workflow_dispatch:

jobs:
  ownership-isolation:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SeleniumBase runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Prove one-session cleanup never kills sibling Chrome PIDs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ares-cleanup-ownership-isolation'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # Test-only wrapper: keep the real OOPIF worker/runtime, but translate
          # parent stdin EOF into the existing close path. No tracked Python
          # production file is modified by this workflow.
          @'
          from __future__ import annotations
          import sys
          from pathlib import Path

          module_dir = Path.cwd() / 'python' / 'seleniumbase_cdp'
          sys.path.insert(0, str(module_dir))
          import task_browser_worker_oopif as oopif

          base = oopif.impl.base
          original_reader = base.command_reader
          original_run = base.run

          def eof_reader(target):
              try:
                  return original_reader(target)
              finally:
                  target.put({"type": "__parent_eof__", "requestId": ""})

          def eof_aware_run(start):
              old_reader = base.command_reader

              def translated_reader(target):
                  class QueueProxy:
                      def put(self, value):
                          if isinstance(value, dict) and value.get("type") == "__parent_eof__":
                              target.put({"type": "close", "requestId": "parent-eof-isolation-smoke"})
                          else:
                              target.put(value)
                  return eof_reader(QueueProxy())

              base.command_reader = translated_reader
              try:
                  return original_run(start)
              finally:
                  base.command_reader = old_reader

          base.run = eof_aware_run
          raise SystemExit(oopif.main())
          '@ | Set-Content -Path oopif_eof_wrapper.py -Encoding UTF8

          @'
          const { spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const slot = String(process.argv[2]);
          const profileDir = String(process.argv[3]);
          const pythonExe = process.env.pythonLocation
            ? path.join(process.env.pythonLocation, 'python.exe')
            : 'python';

          const child = spawn(pythonExe, ['-u', 'oopif_eof_wrapper.py'], {
            stdio: ['pipe', 'pipe', 'pipe'],
            detached: true,
            windowsHide: true,
            env: { ...process.env, PYTHONUNBUFFERED: '1' }
          });

          fs.writeFileSync(`${slot}.python.pid`, String(child.pid));
          child.stdout.pipe(fs.createWriteStream(`${slot}.python.stdout.log`, { flags: 'a' }));
          child.stderr.pipe(fs.createWriteStream(`${slot}.python.stderr.log`, { flags: 'a' }));
          child.stdin.write(JSON.stringify({
            type: 'start',
            requestId: `ownership-start-${slot}`,
            taskId: `ownership-task-${slot}`,
            profileDir,
            headless: true,
            browserArgs: []
          }) + '\n');

          setInterval(() => {}, 1000);
          '@ | Set-Content -Path ownership_parent.js -Encoding UTF8

          function Get-ProfileChromeProcesses([string]$profile) {
            return @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match '^(chrome|chromium).*\.exe$' -and
                  $_.CommandLine -and
                  $_.CommandLine.Contains($profile)
                }
            )
          }

          function Get-ProfileChromePids([string]$profile) {
            return @(
              Get-ProfileChromeProcesses $profile |
                ForEach-Object { [int]$_.ProcessId } |
                Sort-Object -Unique
            )
          }

          function Start-Session([string]$round, [string]$name) {
            $slot = "$round-$name"
            $profile = Join-Path $root "profile-$slot"
            New-Item -ItemType Directory -Force -Path $profile | Out-Null

            $parent = Start-Process node -ArgumentList @('ownership_parent.js',$slot,$profile) -PassThru -RedirectStandardOutput "$slot.node.stdout.log" -RedirectStandardError "$slot.node.stderr.log"
            $pidFile = "$slot.python.pid"
            $stdoutFile = "$slot.python.stdout.log"
            $stderrFile = "$slot.python.stderr.log"
            $deadline = (Get-Date).AddMinutes(3)
            $ready = $null

            while ((Get-Date) -lt $deadline) {
              if ((Test-Path $pidFile) -and (Test-Path $stdoutFile)) {
                $line = Get-Content $stdoutFile -ErrorAction SilentlyContinue |
                  Where-Object { $_ -match '"type"\s*:\s*"ready"' } |
                  Select-Object -Last 1
                if ($line) {
                  $ready = (($line -replace '^ARES_SB_TASK\s*','') | ConvertFrom-Json)
                  break
                }
              }
              if ($parent.HasExited) { break }
              Start-Sleep -Milliseconds 250
            }

            if (-not $ready) {
              Write-Host "--- $slot stderr ---"
              if (Test-Path $stderrFile) { Get-Content $stderrFile }
              throw "$slot did not become ready"
            }

            $pythonPid = [int](Get-Content $pidFile)
            $pythonProc = Get-Process -Id $pythonPid -ErrorAction Stop
            $browserPid = [int]$ready.pid

            # Give Chromium a short settle window so the ownership snapshot is
            # not taken while its normal startup process tree is still forming.
            Start-Sleep -Seconds 2
            $chromePids = @(Get-ProfileChromePids $profile)
            if ($chromePids.Count -lt 1) {
              throw "$slot had no profile-owned Chrome PIDs after READY"
            }

            Write-Host "SESSION_READY slot=$slot node=$($parent.Id) python=$pythonPid browser=$browserPid chromePids=$($chromePids -join ',')"
            return [pscustomobject]@{
              Slot = $slot
              Name = $name
              Profile = $profile
              Parent = $parent
              PythonPid = $pythonPid
              PythonProc = $pythonProc
              BrowserPid = $browserPid
              BeforePids = $chromePids
            }
          }

          function Assert-SiblingUnchanged($session, [string]$phase) {
            $session.Parent.Refresh()
            $session.PythonProc.Refresh()
            if ($session.Parent.HasExited) {
              throw "$phase sibling $($session.Slot) Node parent unexpectedly exited"
            }
            if ($session.PythonProc.HasExited) {
              throw "$phase sibling $($session.Slot) Python unexpectedly exited"
            }

            $afterPids = @(Get-ProfileChromePids $session.Profile)
            $missing = @($session.BeforePids | Where-Object { $_ -notin $afterPids })
            $deadDirect = @(
              $session.BeforePids | Where-Object {
                $null -eq (Get-Process -Id $_ -ErrorAction SilentlyContinue)
              }
            )

            Write-Host "SIBLING_CHECK phase=$phase slot=$($session.Slot) before=$($session.BeforePids -join ',') after=$($afterPids -join ',') missing=$($missing -join ',') deadDirect=$($deadDirect -join ',')"

            if ($missing.Count -gt 0 -or $deadDirect.Count -gt 0) {
              throw "$phase ownership violation: sibling $($session.Slot) lost Chrome PID(s): missing=$($missing -join ',') dead=$($deadDirect -join ',')"
            }
          }

          function Assert-CrashedSessionClean($session, [string]$phase) {
            $session.PythonProc.Refresh()
            $pythonAlive = -not $session.PythonProc.HasExited
            $remaining = @(Get-ProfileChromePids $session.Profile)
            $browserAlive = $null -ne (Get-Process -Id $session.BrowserPid -ErrorAction SilentlyContinue)

            Write-Host "CRASHED_CHECK phase=$phase slot=$($session.Slot) pythonAlive=$pythonAlive browserAlive=$browserAlive remainingChrome=$($remaining -join ',')"

            if ($pythonAlive) {
              throw "$phase crashed session $($session.Slot) Python was still alive"
            }
            if ($browserAlive -or $remaining.Count -gt 0) {
              throw "$phase crashed session $($session.Slot) retained Chrome PID(s): $($remaining -join ',')"
            }
          }

          $roundResults = @()
          foreach ($round in 1..3) {
            Write-Host "=== ROUND $round ==="
            $a = Start-Session "r$round" 'A'
            $b = Start-Session "r$round" 'B'
            $c = Start-Session "r$round" 'C'

            # Snapshot all sibling ownership PIDs only after all three sessions
            # are fully started and settled.
            $b.BeforePids = @(Get-ProfileChromePids $b.Profile)
            $c.BeforePids = @(Get-ProfileChromePids $c.Profile)
            Write-Host "OWNERSHIP_SNAPSHOT round=$round A=$($a.BeforePids -join ',') B=$($b.BeforePids -join ',') C=$($c.BeforePids -join ',')"

            # Crash ONLY A's Node parent. B and C must remain completely untouched.
            Write-Host "CRASH_ONLY round=$round target=A node=$($a.Parent.Id)"
            Stop-Process -Id $a.Parent.Id -Force -ErrorAction Stop

            Start-Sleep -Seconds 5
            Assert-CrashedSessionClean $a "round${round}-after5s"
            Assert-SiblingUnchanged $b "round${round}-after5s"
            Assert-SiblingUnchanged $c "round${round}-after5s"

            # Hold another window to catch delayed/over-broad cleanup.
            Start-Sleep -Seconds 5
            Assert-CrashedSessionClean $a "round${round}-after10s"
            Assert-SiblingUnchanged $b "round${round}-after10s"
            Assert-SiblingUnchanged $c "round${round}-after10s"

            # Cleanup the two surviving test sessions by dropping their own
            # control pipes; the same EOF path must only clean their own profiles.
            Stop-Process -Id $b.Parent.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            Assert-CrashedSessionClean $b "round${round}-cleanupB"
            Assert-SiblingUnchanged $c "round${round}-afterBcleanup"

            Stop-Process -Id $c.Parent.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            Assert-CrashedSessionClean $c "round${round}-cleanupC"

            $roundResults += [pscustomobject]@{ Round=$round; Passed=$true }
          }

          Write-Host '=== OWNERSHIP ISOLATION SUMMARY ==='
          foreach ($result in $roundResults) {
            Write-Host "OWNERSHIP_RESULT round=$($result.Round) passed=$($result.Passed)"
          }
          Write-Host 'OWNERSHIP_ISOLATION_PASS: no Chrome PID from B/C disappeared during another session cleanup.'

      - name: Upload ownership smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-oopif-cleanup-ownership-logs
          path: |
            *.python.stdout.log
            *.python.stderr.log
            *.node.stdout.log
            *.node.stderr.log
          if-no-files-found: ignore
