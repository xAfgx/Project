name: Windows Node child survival matrix

on:
  push:
    branches:
      - smoke/windows-node-hardcrash
  workflow_dispatch:

jobs:
  spawn-semantics:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Node child survival by detached and stdio mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ares-node-child-semantics'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          @'
          import os
          import sys
          import time
          from pathlib import Path

          ready = Path(sys.argv[1])
          heartbeat = Path(sys.argv[2])
          ready.write_text(str(os.getpid()), encoding='utf-8')
          while True:
              heartbeat.write_text(f"{os.getpid()} {time.time():.6f}", encoding='utf-8')
              time.sleep(0.25)
          '@ | Set-Content -Path plain_survivor.py -Encoding UTF8

          @'
          const { spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const mode = String(process.argv[2]);
          const ready = String(process.argv[3]);
          const heartbeat = String(process.argv[4]);
          const childPidFile = String(process.argv[5]);
          const pythonExe = process.env.pythonLocation
            ? path.join(process.env.pythonLocation, 'python.exe')
            : 'python';

          const detached = mode.includes('detached');
          const ignored = mode.includes('ignored');
          const options = {
            detached,
            windowsHide: true,
            stdio: ignored ? 'ignore' : ['pipe', 'pipe', 'pipe'],
            env: { ...process.env, PYTHONUNBUFFERED: '1' }
          };
          const child = spawn(pythonExe, ['-u', 'plain_survivor.py', ready, heartbeat], options);
          fs.writeFileSync(childPidFile, String(child.pid));
          if (!ignored) {
            child.stdout.resume();
            child.stderr.resume();
          }
          if (mode.includes('unref')) child.unref();
          setInterval(() => {}, 1000);
          '@ | Set-Content -Path spawn_parent.js -Encoding UTF8

          function Wait-Ready([string]$readyFile, [string]$pidFile) {
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path $readyFile) -and (Test-Path $pidFile)) { return }
              Start-Sleep -Milliseconds 100
            }
            throw "child did not become ready: $readyFile"
          }

          function Run-NodeCase([string]$mode) {
            $ready = Join-Path $root "$mode.ready"
            $heartbeat = Join-Path $root "$mode.heartbeat"
            $pidFile = Join-Path $root "$mode.pid"
            $parent = Start-Process node -ArgumentList @('spawn_parent.js', $mode, $ready, $heartbeat, $pidFile) -PassThru
            Wait-Ready $ready $pidFile
            $childPid = [int](Get-Content $pidFile)
            $childProc = Get-Process -Id $childPid -ErrorAction Stop
            $cimBefore = Get-CimInstance Win32_Process -Filter "ProcessId=$childPid"
            Write-Host "CASE_READY mode=$mode node=$($parent.Id) child=$childPid childPPID=$($cimBefore.ParentProcessId)"
            Stop-Process -Id $parent.Id -Force -ErrorAction Stop
            Start-Sleep -Seconds 3
            $childProc.Refresh()
            $alive = -not $childProc.HasExited
            $hbExists = Test-Path $heartbeat
            $hb = if ($hbExists) { Get-Content $heartbeat } else { '' }
            Write-Host "CASE_RESULT mode=$mode aliveAfter3s=$alive heartbeat=$hb"
            if ($alive) { Stop-Process -Id $childPid -Force -ErrorAction SilentlyContinue }
            return [pscustomobject]@{ Mode=$mode; Alive=$alive }
          }

          # Control: Python is started directly by PowerShell, not by Node.
          $controlReady = Join-Path $root 'control.ready'
          $controlHeartbeat = Join-Path $root 'control.heartbeat'
          $control = Start-Process python -ArgumentList @('-u','plain_survivor.py',$controlReady,$controlHeartbeat) -PassThru
          $dummyNode = Start-Process node -ArgumentList @('-e','setInterval(()=>{},1000)') -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $controlReady)) { Start-Sleep -Milliseconds 100 }
          if (-not (Test-Path $controlReady)) { throw 'control Python did not start' }
          Write-Host "CONTROL_READY python=$($control.Id) dummyNode=$($dummyNode.Id)"
          Stop-Process -Id $dummyNode.Id -Force -ErrorAction Stop
          Start-Sleep -Seconds 3
          $control.Refresh()
          $controlAlive = -not $control.HasExited
          Write-Host "CONTROL_RESULT directPythonAliveAfterUnrelatedNodeKill=$controlAlive"
          if ($controlAlive) { Stop-Process -Id $control.Id -Force -ErrorAction SilentlyContinue }

          $modes = @(
            'attached-pipes',
            'attached-ignored',
            'detached-pipes',
            'detached-ignored',
            'detached-ignored-unref'
          )
          $results = @()
          foreach ($mode in $modes) { $results += Run-NodeCase $mode }

          Write-Host '=== SPAWN SEMANTICS SUMMARY ==='
          Write-Host "CONTROL directPythonAlive=$controlAlive"
          foreach ($result in $results) {
            Write-Host "SPAWN mode=$($result.Mode) aliveAfterNodeKill=$($result.Alive)"
          }
