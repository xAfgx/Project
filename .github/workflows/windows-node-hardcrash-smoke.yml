name: Windows Node hard-crash smoke

on:
  push:
    branches:
      - smoke/windows-node-hardcrash
  workflow_dispatch:

jobs:
  hardcrash-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SeleniumBase runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Run five real Node to Python to Chrome parent-crash smokes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sessionCount = 5
          $root = Join-Path $env:RUNNER_TEMP 'ares-hardcrash-multi'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          @'
          const { spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const slot = String(process.argv[2] || '0');
          const profileDir = String(process.argv[3] || '');
          const pythonExe = process.env.pythonLocation
            ? path.join(process.env.pythonLocation, 'python.exe')
            : 'python';
          const prefix = `session-${slot}`;

          const child = spawn(
            pythonExe,
            ['-u', 'python/seleniumbase_cdp/task_browser_worker.py'],
            {
              stdio: ['pipe', 'pipe', 'pipe'],
              windowsHide: true,
              env: { ...process.env, PYTHONUNBUFFERED: '1' }
            }
          );

          fs.writeFileSync(`${prefix}.python.pid`, String(child.pid));
          child.stdout.pipe(fs.createWriteStream(`${prefix}.python.stdout.log`, { flags: 'a' }));
          child.stderr.pipe(fs.createWriteStream(`${prefix}.python.stderr.log`, { flags: 'a' }));

          child.stdin.write(JSON.stringify({
            type: 'start',
            requestId: `hardcrash-smoke-start-${slot}`,
            taskId: `hardcrash-smoke-task-${slot}`,
            profileDir,
            headless: true,
            browserArgs: []
          }) + '\n');

          setInterval(() => {}, 1000);
          '@ | Set-Content -Path crash-parent.js -Encoding UTF8

          $sessions = @()
          for ($i = 1; $i -le $sessionCount; $i++) {
            $profile = Join-Path $root "profile-$i"
            New-Item -ItemType Directory -Force -Path $profile | Out-Null
            $parent = Start-Process node -ArgumentList @('crash-parent.js', "$i", $profile) -PassThru -RedirectStandardOutput "session-$i.node.stdout.log" -RedirectStandardError "session-$i.node.stderr.log"
            $sessions += [pscustomobject]@{
              Slot = $i
              Profile = $profile
              Parent = $parent
              PythonPid = $null
              ChromePid = $null
            }
            Write-Host "SESSION $i Node parent PID=$($parent.Id) profile=$profile"
          }

          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $readyCount = 0
            foreach ($session in $sessions) {
              if ($session.PythonPid -and $session.ChromePid) {
                $readyCount++
                continue
              }

              $pidFile = "session-$($session.Slot).python.pid"
              $stdoutFile = "session-$($session.Slot).python.stdout.log"
              if ((Test-Path $pidFile) -and (Test-Path $stdoutFile)) {
                $readyLine = Get-Content $stdoutFile -ErrorAction SilentlyContinue |
                  Where-Object { $_ -match '"type"\s*:\s*"ready"' } |
                  Select-Object -Last 1
                if ($readyLine) {
                  $session.PythonPid = [int](Get-Content $pidFile)
                  $jsonText = $readyLine -replace '^ARES_SB_TASK\s*', ''
                  $ready = $jsonText | ConvertFrom-Json
                  $session.ChromePid = [int]$ready.pid
                  Write-Host "SESSION $($session.Slot) READY python=$($session.PythonPid) chrome=$($session.ChromePid)"
                  $readyCount++
                }
              }

              if ($session.Parent.HasExited -and -not $session.ChromePid) {
                throw "SESSION $($session.Slot) Node parent exited before Python worker became ready. exit=$($session.Parent.ExitCode)"
              }
            }

            if ($readyCount -eq $sessionCount) { break }
            Start-Sleep -Milliseconds 500
          }

          $notReady = @($sessions | Where-Object { -not $_.PythonPid -or -not $_.ChromePid })
          if ($notReady.Count -gt 0) {
            foreach ($session in $notReady) {
              Write-Host "SESSION $($session.Slot) NOT READY"
              $stdoutFile = "session-$($session.Slot).python.stdout.log"
              $stderrFile = "session-$($session.Slot).python.stderr.log"
              if (Test-Path $stdoutFile) { Get-Content $stdoutFile }
              if (Test-Path $stderrFile) { Get-Content $stderrFile }
            }
            throw "$($notReady.Count) of $sessionCount SeleniumBase workers did not become ready."
          }

          foreach ($session in $sessions) {
            if (-not (Get-Process -Id $session.PythonPid -ErrorAction SilentlyContinue)) {
              throw "SESSION $($session.Slot) Python worker was not alive before parent crash."
            }
            if (-not (Get-Process -Id $session.ChromePid -ErrorAction SilentlyContinue)) {
              throw "SESSION $($session.Slot) Chrome was not alive before parent crash."
            }
          }

          Write-Host "Hard-killing all $sessionCount Node parents..."
          foreach ($session in $sessions) {
            Stop-Process -Id $session.Parent.Id -Force -ErrorAction Stop
          }

          function Get-SessionState($session, $label) {
            $pythonAlive = $null -ne (Get-Process -Id $session.PythonPid -ErrorAction SilentlyContinue)
            $reportedChromeAlive = $null -ne (Get-Process -Id $session.ChromePid -ErrorAction SilentlyContinue)
            $profileChromes = @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match '^(chrome|chromium).*\.exe$' -and
                  $_.CommandLine -and
                  $_.CommandLine.Contains($session.Profile)
                }
            )
            Write-Host "RESULT $label session=$($session.Slot) pythonAlive=$pythonAlive reportedChromeAlive=$reportedChromeAlive profileChromeCount=$($profileChromes.Count)"
            foreach ($proc in $profileChromes) {
              Write-Host "  session=$($session.Slot) Chrome PID=$($proc.ProcessId) PPID=$($proc.ParentProcessId)"
            }
            return [pscustomobject]@{
              Slot = $session.Slot
              PythonAlive = $pythonAlive
              ReportedChromeAlive = $reportedChromeAlive
              ProfileChromes = $profileChromes
            }
          }

          Start-Sleep -Seconds 5
          $states5 = @()
          foreach ($session in $sessions) {
            $states5 += Get-SessionState $session 'after5s'
          }

          Start-Sleep -Seconds 15
          $states20 = @()
          foreach ($session in $sessions) {
            $states20 += Get-SessionState $session 'after20s'
          }

          $zombieSessions = @($states20 | Where-Object {
            $_.PythonAlive -or $_.ReportedChromeAlive -or $_.ProfileChromes.Count -gt 0
          })

          Write-Host "SUMMARY sessions=$sessionCount zombiesAfter20s=$($zombieSessions.Count)"
          foreach ($state in $zombieSessions) {
            Write-Host "SUMMARY zombieSession=$($state.Slot) python=$($state.PythonAlive) chrome=$($state.ReportedChromeAlive) chromeCount=$($state.ProfileChromes.Count)"
          }

          # Always clean up all isolated test processes before reporting the result.
          foreach ($session in $sessions) {
            Stop-Process -Id $session.PythonPid -Force -ErrorAction SilentlyContinue
          }
          foreach ($state in $states20) {
            foreach ($proc in $state.ProfileChromes) {
              Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          if ($zombieSessions.Count -gt 0) {
            Write-Error "ZOMBIE_REPRODUCED_MULTI: $($zombieSessions.Count) of $sessionCount independent Chrome sessions still had Python and/or profile-owned Chrome after 20 seconds."
            exit 42
          }

          Write-Host "CLEAN_EXIT_MULTI: all $sessionCount independent sessions disappeared after Node parent death."

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-node-hardcrash-multi-smoke-logs
          path: |
            session-*.python.stdout.log
            session-*.python.stderr.log
            session-*.node.stdout.log
            session-*.node.stderr.log
          if-no-files-found: ignore
