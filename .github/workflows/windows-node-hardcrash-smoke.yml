name: Windows detached OOPIF EOF cleanup proof

on:
  push:
    branches:
      - smoke/windows-node-hardcrash
  workflow_dispatch:

jobs:
  detached-eof-proof:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SeleniumBase runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Compare current EOF behavior with EOF close sentinel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ares-detached-oopif-eof-proof'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # Runtime-only wrapper. It does not edit any tracked Python source.
          @'
          from __future__ import annotations
          import sys
          from pathlib import Path

          module_dir = Path.cwd() / 'python' / 'seleniumbase_cdp'
          sys.path.insert(0, str(module_dir))
          import task_browser_worker_oopif as oopif

          base = oopif.impl.base
          original_reader = base.command_reader

          def eof_closing_reader(target):
              try:
                  return original_reader(target)
              finally:
                  # Internal-only command: parent control pipe disappeared.
                  # Do not emit a reply because stdout vanished with the parent.
                  target.put({"type": "__parent_eof__", "requestId": ""})

          original_run = base.run

          def eof_aware_run(start):
              if str(start.get("type") or "") != "start":
                  raise ValueError("First command must be type='start'")

              # Reuse the production run function, but temporarily translate the
              # internal EOF marker into the already-supported close command.
              # This monkeypatch is isolated to this smoke runner only.
              old_reader = base.command_reader

              def translated_reader(target):
                  class QueueProxy:
                      def put(self, value):
                          if isinstance(value, dict) and value.get("type") == "__parent_eof__":
                              target.put({"type": "close", "requestId": "parent-eof-smoke"})
                          else:
                              target.put(value)
                  return eof_closing_reader(QueueProxy())

              base.command_reader = translated_reader
              try:
                  return original_run(start)
              finally:
                  base.command_reader = old_reader

          base.run = eof_aware_run
          raise SystemExit(oopif.main())
          '@ | Set-Content -Path oopif_eof_wrapper.py -Encoding UTF8

          @'
          const { spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const mode = String(process.argv[2]);
          const slot = String(process.argv[3]);
          const profileDir = String(process.argv[4]);
          const pythonExe = process.env.pythonLocation
            ? path.join(process.env.pythonLocation, 'python.exe')
            : 'python';
          const script = mode === 'fixed'
            ? 'oopif_eof_wrapper.py'
            : 'python/seleniumbase_cdp/task_browser_worker_oopif.py';
          const prefix = `${mode}-${slot}`;

          const child = spawn(pythonExe, ['-u', script], {
            stdio: ['pipe', 'pipe', 'pipe'],
            detached: true,
            windowsHide: true,
            env: { ...process.env, PYTHONUNBUFFERED: '1' }
          });

          fs.writeFileSync(`${prefix}.python.pid`, String(child.pid));
          child.stdout.pipe(fs.createWriteStream(`${prefix}.python.stdout.log`, { flags: 'a' }));
          child.stderr.pipe(fs.createWriteStream(`${prefix}.python.stderr.log`, { flags: 'a' }));
          child.stdin.write(JSON.stringify({
            type: 'start',
            requestId: `${mode}-start-${slot}`,
            taskId: `${mode}-task-${slot}`,
            profileDir,
            headless: true,
            browserArgs: []
          }) + '\n');
          setInterval(() => {}, 1000);
          '@ | Set-Content -Path detached_parent.js -Encoding UTF8

          function Run-Case([string]$mode, [int]$slot) {
            $prefix = "$mode-$slot"
            $profile = Join-Path $root "profile-$prefix"
            New-Item -ItemType Directory -Force -Path $profile | Out-Null
            $parent = Start-Process node -ArgumentList @('detached_parent.js',$mode,"$slot",$profile) -PassThru
            $pidFile = "$prefix.python.pid"
            $stdoutFile = "$prefix.python.stdout.log"
            $stderrFile = "$prefix.python.stderr.log"

            $deadline = (Get-Date).AddMinutes(3)
            $ready = $null
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path $pidFile) -and (Test-Path $stdoutFile)) {
                $line = Get-Content $stdoutFile -ErrorAction SilentlyContinue |
                  Where-Object { $_ -match '"type"\s*:\s*"ready"' } |
                  Select-Object -Last 1
                if ($line) {
                  $ready = (($line -replace '^ARES_SB_TASK\s*','') | ConvertFrom-Json)
                  break
                }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              if (Test-Path $stderrFile) { Get-Content $stderrFile }
              throw "$prefix did not become ready"
            }

            $pythonPid = [int](Get-Content $pidFile)
            $pythonProc = Get-Process -Id $pythonPid -ErrorAction Stop
            $chromePid = [int]$ready.pid
            Write-Host "CASE_READY mode=$mode slot=$slot node=$($parent.Id) python=$pythonPid chrome=$chromePid"

            Stop-Process -Id $parent.Id -Force -ErrorAction Stop
            Start-Sleep -Seconds 5
            $pythonProc.Refresh()
            $pythonAlive5 = -not $pythonProc.HasExited
            $profileChromes5 = @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match '^(chrome|chromium).*\.exe$' -and
                  $_.CommandLine -and $_.CommandLine.Contains($profile)
                }
            )
            Write-Host "CASE_RESULT mode=$mode slot=$slot after=5s pythonAlive=$pythonAlive5 chromeCount=$($profileChromes5.Count)"

            Start-Sleep -Seconds 10
            $pythonProc.Refresh()
            $pythonAlive15 = -not $pythonProc.HasExited
            $exitCode = 'still-running'
            if (-not $pythonAlive15) {
              try { $exitCode = [string]$pythonProc.ExitCode } catch { $exitCode = 'unavailable' }
            }
            $profileChromes15 = @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match '^(chrome|chromium).*\.exe$' -and
                  $_.CommandLine -and $_.CommandLine.Contains($profile)
                }
            )
            Write-Host "CASE_RESULT mode=$mode slot=$slot after=15s pythonAlive=$pythonAlive15 pythonExit=$exitCode chromeCount=$($profileChromes15.Count)"
            if (Test-Path $stderrFile) {
              $stderrTail = @(Get-Content $stderrFile -ErrorAction SilentlyContinue | Select-Object -Last 30)
              if ($stderrTail.Count -gt 0) {
                Write-Host "--- STDERR $prefix ---"
                $stderrTail
              }
            }

            Stop-Process -Id $pythonPid -Force -ErrorAction SilentlyContinue
            foreach ($proc in $profileChromes15) { Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue }

            return [pscustomobject]@{
              Mode=$mode
              Slot=$slot
              PythonAlive=$pythonAlive15
              ChromeCount=$profileChromes15.Count
              Exit=$exitCode
            }
          }

          $results = @()
          foreach ($slot in 1..2) { $results += Run-Case 'current' $slot }
          foreach ($slot in 1..2) { $results += Run-Case 'fixed' $slot }

          Write-Host '=== DETACHED EOF PROOF SUMMARY ==='
          foreach ($mode in @('current','fixed')) {
            $subset = @($results | Where-Object { $_.Mode -eq $mode })
            $alive = @($subset | Where-Object { $_.PythonAlive }).Count
            $zombie = @($subset | Where-Object { $_.ChromeCount -gt 0 }).Count
            Write-Host "EOF_PROOF mode=$mode pythonAlive=$alive/$($subset.Count) chromeZombie=$zombie/$($subset.Count)"
          }
