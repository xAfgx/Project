name: Windows awaited UI-stop + OOPIF isolation smoke

on:
  push:
    branches:
      - smoke/windows-node-hardcrash
  workflow_dispatch:

jobs:
  awaited-stop-isolation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Build backend
        shell: pwsh
        run: npm run build:backend

      - name: Prove awaited cancellation does not block event loop or race to SUCCESS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const assert = require('assert');
          const { TaskOrchestrator } = require('./dist/backend/orchestrator');
          const { TaskRepositoryMock, WorkerMock } = require('./dist/backend/mocks');
          const { TaskState } = require('./dist/backend/models');

          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const repository = new TaskRepositoryMock();
            let releaseCancel;
            let cancelStarted = false;
            const cancelGate = new Promise(resolve => { releaseCancel = resolve; });

            const executor = {
              async execute() {
                await delay(80);
                return true;
              },
              async cancelTask() {
                cancelStarted = true;
                await cancelGate;
              }
            };

            const orchestrator = new TaskOrchestrator(repository, executor);
            orchestrator.addWorker(new WorkerMock('stop-smoke-worker'));
            const task = orchestrator.createTask({ id: 'awaited-stop-smoke', name: 'awaited-stop-smoke', maxRetries: 0 });

            const startPromise = orchestrator.startTask(task.id);
            const runningDeadline = Date.now() + 2000;
            while (task.state !== TaskState.RUNNING && Date.now() < runningDeadline) await delay(5);
            assert.strictEqual(task.state, TaskState.RUNNING, 'task never reached RUNNING');

            let eventLoopTicks = 0;
            const ticker = setInterval(() => { eventLoopTicks += 1; }, 10);
            const stopStartedAt = Date.now();
            let stopResolved = false;
            const stopPromise = orchestrator.cancelTask(task.id).then(() => { stopResolved = true; });

            await delay(180);
            assert.strictEqual(cancelStarted, true, 'executor.cancelTask was not invoked');
            assert.strictEqual(stopResolved, false, 'cancelTask resolved before browser cleanup gate');
            assert.ok(eventLoopTicks >= 5, `event loop was not responsive while awaiting cancel; ticks=${eventLoopTicks}`);
            assert.strictEqual(task.state, TaskState.RUNNING, `task changed state before cleanup completed: ${task.state}`);

            // execute() has already returned true by now. The in-flight cancellation
            // must suppress the normal SUCCESS transition until cleanup finishes.
            await startPromise;
            assert.strictEqual(task.state, TaskState.RUNNING, `execute raced task to terminal state during cancellation: ${task.state}`);

            releaseCancel();
            await stopPromise;
            clearInterval(ticker);

            const elapsedMs = Date.now() - stopStartedAt;
            assert.strictEqual(task.state, TaskState.CANCELLED, `expected CANCELLED after cleanup, got ${task.state}`);
            assert.ok(elapsedMs >= 180, `stop did not actually await cleanup: ${elapsedMs}ms`);

            console.log(`AWAITED_STOP_PASS elapsedMs=${elapsedMs} eventLoopTicks=${eventLoopTicks} finalState=${task.state}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          '@ | Set-Content -Path awaited_stop_smoke.js -Encoding UTF8
          node awaited_stop_smoke.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SeleniumBase runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-seleniumbase-cdp.txt

      - name: Test production close RPC and sibling PID isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ares-ui-close-isolation'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          @'
          const { spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const slot = String(process.argv[2]);
          const profileDir = String(process.argv[3]);
          const pythonExe = process.env.pythonLocation
            ? path.join(process.env.pythonLocation, 'python.exe')
            : 'python';
          const prefix = slot;
          const closeRequest = `${prefix}.close.request`;
          const closeSent = `${prefix}.close.sent`;
          const closeAck = `${prefix}.close.ack`;
          const exitFile = `${prefix}.python.exit`;
          const readyFile = `${prefix}.ready.json`;
          const stdoutFile = `${prefix}.python.stdout.log`;
          const stderrFile = `${prefix}.python.stderr.log`;

          const child = spawn(pythonExe, ['-u', 'python/seleniumbase_cdp/task_browser_worker_oopif.py'], {
            stdio: ['pipe', 'pipe', 'pipe'],
            windowsHide: true,
            env: { ...process.env, PYTHONUNBUFFERED: '1' }
          });

          fs.writeFileSync(`${prefix}.python.pid`, String(child.pid));
          const out = fs.createWriteStream(stdoutFile, { flags: 'a' });
          const err = fs.createWriteStream(stderrFile, { flags: 'a' });
          let stdoutBuffer = '';
          let closeWasSent = false;

          child.stdout.setEncoding('utf8');
          child.stdout.on('data', chunk => {
            const text = String(chunk);
            out.write(text);
            stdoutBuffer += text;
            const lines = stdoutBuffer.split(/\r?\n/);
            stdoutBuffer = lines.pop() || '';
            for (const line of lines) {
              if (!line.startsWith('ARES_SB_TASK\t')) continue;
              try {
                const msg = JSON.parse(line.slice('ARES_SB_TASK\t'.length));
                if (msg.type === 'ready') fs.writeFileSync(readyFile, JSON.stringify(msg));
                if (msg.type === 'closed') fs.writeFileSync(closeAck, String(Date.now()));
              } catch {}
            }
          });
          child.stderr.pipe(err);
          child.on('exit', (code, signal) => {
            fs.writeFileSync(exitFile, JSON.stringify({ code, signal, at: Date.now() }));
          });

          child.stdin.write(JSON.stringify({
            type: 'start',
            requestId: `start-${slot}`,
            taskId: `ui-close-task-${slot}`,
            profileDir,
            headless: true,
            browserArgs: []
          }) + '\n');

          setInterval(() => {
            if (closeWasSent || !fs.existsSync(closeRequest)) return;
            closeWasSent = true;
            fs.writeFileSync(closeSent, String(Date.now()));
            child.stdin.write(JSON.stringify({ type: 'close', requestId: `ui-close-${slot}` }) + '\n');
          }, 50);

          setInterval(() => {}, 1000);
          '@ | Set-Content -Path ui_close_parent.js -Encoding UTF8

          function Get-ProfileChromePids([string]$profile) {
            return @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match '^(chrome|chromium).*\.exe$' -and
                  $_.CommandLine -and
                  $_.CommandLine.Contains($profile)
                } |
                ForEach-Object { [int]$_.ProcessId } |
                Sort-Object -Unique
            )
          }

          function Start-Session([string]$round, [string]$name) {
            $slot = "$round-$name"
            $profile = Join-Path $root "profile-$slot"
            New-Item -ItemType Directory -Force -Path $profile | Out-Null
            $parent = Start-Process node -ArgumentList @('ui_close_parent.js',$slot,$profile) -PassThru -RedirectStandardOutput "$slot.node.stdout.log" -RedirectStandardError "$slot.node.stderr.log"
            $readyFile = "$slot.ready.json"
            $pidFile = "$slot.python.pid"
            $stderrFile = "$slot.python.stderr.log"
            $deadline = (Get-Date).AddMinutes(3)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $readyFile)) {
              if ($parent.HasExited) { break }
              Start-Sleep -Milliseconds 100
            }
            if (-not (Test-Path $readyFile)) {
              if (Test-Path $stderrFile) { Get-Content $stderrFile }
              throw "$slot did not become ready"
            }
            $ready = Get-Content $readyFile | ConvertFrom-Json
            $pythonPid = [int](Get-Content $pidFile)
            $pythonProc = Get-Process -Id $pythonPid -ErrorAction Stop
            Start-Sleep -Seconds 2
            $pids = @(Get-ProfileChromePids $profile)
            if ($pids.Count -lt 1) { throw "$slot had no Chrome PIDs" }
            Write-Host "SESSION_READY slot=$slot node=$($parent.Id) python=$pythonPid browser=$([int]$ready.pid) chromePids=$($pids -join ',')"
            return [pscustomobject]@{
              Slot=$slot; Profile=$profile; Parent=$parent; PythonPid=$pythonPid; PythonProc=$pythonProc; BrowserPid=[int]$ready.pid; BeforePids=$pids
            }
          }

          function Assert-SiblingUnchanged($session, [string]$phase) {
            $session.Parent.Refresh()
            $session.PythonProc.Refresh()
            if ($session.Parent.HasExited) { throw "$phase sibling $($session.Slot) Node parent exited" }
            if ($session.PythonProc.HasExited) { throw "$phase sibling $($session.Slot) Python exited" }
            $after = @(Get-ProfileChromePids $session.Profile)
            $missing = @($session.BeforePids | Where-Object { $_ -notin $after })
            $dead = @($session.BeforePids | Where-Object { $null -eq (Get-Process -Id $_ -ErrorAction SilentlyContinue) })
            Write-Host "SIBLING_CHECK phase=$phase slot=$($session.Slot) before=$($session.BeforePids -join ',') after=$($after -join ',') missing=$($missing -join ',') dead=$($dead -join ',')"
            if ($missing.Count -gt 0 -or $dead.Count -gt 0) {
              throw "$phase sibling ownership violation for $($session.Slot): missing=$($missing -join ',') dead=$($dead -join ',')"
            }
          }

          function Request-UiClose($session, [string]$phase) {
            $requestFile = "$($session.Slot).close.request"
            $sentFile = "$($session.Slot).close.sent"
            $ackFile = "$($session.Slot).close.ack"
            $exitFile = "$($session.Slot).python.exit"
            Set-Content -Path $requestFile -Value 'close' -Encoding ascii
            $start = Get-Date
            $deadline = $start.AddSeconds(25)
            $remaining = @($session.BeforePids)
            while ((Get-Date) -lt $deadline) {
              $remaining = @(Get-ProfileChromePids $session.Profile)
              $session.PythonProc.Refresh()
              if ($remaining.Count -eq 0 -and $session.PythonProc.HasExited) { break }
              Start-Sleep -Milliseconds 100
            }
            $elapsed = [int]((Get-Date) - $start).TotalMilliseconds
            $remaining = @(Get-ProfileChromePids $session.Profile)
            $session.PythonProc.Refresh()
            $pythonAlive = -not $session.PythonProc.HasExited
            $browserAlive = $null -ne (Get-Process -Id $session.BrowserPid -ErrorAction SilentlyContinue)
            $ack = Test-Path $ackFile
            $sent = Test-Path $sentFile
            $exited = Test-Path $exitFile
            $session.Parent.Refresh()
            $parentAlive = -not $session.Parent.HasExited
            Write-Host "UI_CLOSE_RESULT phase=$phase slot=$($session.Slot) elapsedMs=$elapsed sent=$sent ack=$ack pythonAlive=$pythonAlive browserAlive=$browserAlive remainingChrome=$($remaining -join ',') nodeParentAlive=$parentAlive exitMarker=$exited"
            if (-not $sent) { throw "$phase close request was never sent" }
            if (-not $ack) { throw "$phase Python never acknowledged close" }
            if ($pythonAlive) { throw "$phase Python still alive after close" }
            if ($browserAlive -or $remaining.Count -gt 0) { throw "$phase Chrome still alive after close: $($remaining -join ',')" }
            if (-not $parentAlive) { throw "$phase Node parent died during normal UI-style close" }
            return $elapsed
          }

          $results = @()
          foreach ($round in 1..3) {
            Write-Host "=== ROUND $round ==="
            $a = Start-Session "r$round" 'A'
            $b = Start-Session "r$round" 'B'
            $c = Start-Session "r$round" 'C'
            $a.BeforePids = @(Get-ProfileChromePids $a.Profile)
            $b.BeforePids = @(Get-ProfileChromePids $b.Profile)
            $c.BeforePids = @(Get-ProfileChromePids $c.Profile)
            Write-Host "OWNERSHIP_SNAPSHOT round=$round A=$($a.BeforePids -join ',') B=$($b.BeforePids -join ',') C=$($c.BeforePids -join ',')"

            $aMs = Request-UiClose $a "round${round}-A"
            Assert-SiblingUnchanged $b "round${round}-afterA"
            Assert-SiblingUnchanged $c "round${round}-afterA"

            $bMs = Request-UiClose $b "round${round}-B"
            Assert-SiblingUnchanged $c "round${round}-afterB"

            $cMs = Request-UiClose $c "round${round}-C"

            foreach ($parent in @($a.Parent,$b.Parent,$c.Parent)) {
              Stop-Process -Id $parent.Id -Force -ErrorAction SilentlyContinue
            }
            $results += [pscustomobject]@{ Round=$round; Ams=$aMs; Bms=$bMs; Cms=$cMs }
          }

          Write-Host '=== UI CLOSE ISOLATION SUMMARY ==='
          foreach ($r in $results) {
            Write-Host "UI_CLOSE_PASS round=$($r.Round) Ams=$($r.Ams) Bms=$($r.Bms) Cms=$($r.Cms)"
          }
          Write-Host 'UI_CLOSE_ISOLATION_PASS: close RPC removed only the targeted session Chrome/Python; sibling Chrome PIDs remained alive.'

      - name: Upload UI-close smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-awaited-stop-ui-close-isolation-logs
          path: |
            *.python.stdout.log
            *.python.stderr.log
            *.node.stdout.log
            *.node.stderr.log
            *.python.exit
            *.close.sent
            *.close.ack
          if-no-files-found: ignore
